# Rate limiting : max 5 requêtes/minute sur /api/analyze
limit_req_zone $binary_remote_addr zone=analyze_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — force la ré-résolution du hostname chess_api toutes les 30s.
    # Sans ça, nginx cache l'IP au démarrage et casse dès qu'on rebuild chess-api.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy vers l'API Flask
    # Upstream en variable pour activer la résolution dynamique (sinon nginx cache l'IP).
    location /api/ {
        set $upstream_api http://chess_api:5000;
        proxy_pass         $upstream_api$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Rate limiting strict sur l'endpoint qui consomme du CPU
    location /api/analyze {
        limit_req zone=analyze_limit burst=3 nodelay;
        limit_req_status 429;
        set $upstream_api http://chess_api:5000;
        proxy_pass         $upstream_api$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # JSON data — monté séparément dans /data
    location /data/ {
        alias /data/;
        add_header Content-Type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # Assets statiques — cache 1h
    location ~* \.(css|js|woff2?)$ {
        add_header Cache-Control "max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
