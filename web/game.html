<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse partie – Chess</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Échiquier custom ── */
    #chess-board-wrap {
      width: min(calc(100vh - 52px - 220px), 520px);
      height: min(calc(100vh - 52px - 220px), 520px);
      flex-shrink: 0;
    }
    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
      container-type: size;
      position: relative;
    }
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .sq.light { background: #eeeed2; }
    .sq.dark  { background: #769656; }
    /* last-move fallback (n/a ou classification inconnue) */
    .sq.last-move.light { background: #cdd52e; }
    .sq.last-move.dark  { background: #aaa23a; }
    /* last-move coloré par classification (inline style prioritaire) */
    .piece {
      font-size: clamp(24px, 9cqw, 68px);
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }
    .piece.w { color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #444; }
    .piece.b { color: #1a1a1a; text-shadow: 0 0 1px rgba(255,255,255,0.5); }
    .coord-lbl {
      position: absolute;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }
    .sq.light .coord-lbl { color: #769656; }
    .sq.dark  .coord-lbl { color: #eeeed2; }
    .coord-rank-lbl { top: 2px; left: 3px; }
    .coord-file-lbl { bottom: 2px; right: 3px; }
  </style>
</head>
<body>

<header class="site-header">
  <button class="back-btn" onclick="history.length>1 ? history.back() : location.href='index.html'">‹</button>
  <div class="logo">♟ <span>Chess</span>Analysis</div>
  <span id="header-title" style="color:var(--text-muted);font-size:13px;margin-left:4px"></span>
</header>

<div id="app" style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 52px)">
  <div class="loading"><div class="spinner"></div> Chargement…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

<script>
// ── Constantes ────────────────────────────────────────────────────
const PIECE_UNICODE = {
  K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',
  k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'
};
const SYMBOLS = {
  blunder:'??', mistake:'?', inaccuracy:'?!',
  good:'!', excellent:'!!', best:'', 'n/a':''
};
const SYM_CLASS = {
  blunder:'sym-blunder', mistake:'sym-mistake', inaccuracy:'sym-inaccuracy',
  good:'sym-good', excellent:'sym-excellent', best:'sym-best'
};
const FILES = ['a','b','c','d','e','f','g','h'];
const CLASSIF_RGBA = {
  blunder:    [244, 67,  54],
  mistake:    [255, 152, 0],
  inaccuracy: [255, 235, 59],
  good:       [129, 182, 76],
  excellent:  [124, 185, 244],
  best:       [156, 91,  255],
};

// ── État ──────────────────────────────────────────────────────────
const uuid = new URLSearchParams(location.search).get('id');
let gameData = null;
let evalChart = null;
let currentHalfMove = 0;
let flipped = false;

// ── Fetch JSON ────────────────────────────────────────────────────
async function loadGame() {
  const res = await fetch(`data/${uuid}.json?t=${Date.now()}`);
  if (!res.ok) throw new Error('Partie introuvable');
  return res.json();
}

// ── FEN → tableau 8x8 ────────────────────────────────────────────
function parseFen(fen) {
  const rows = fen.split(' ')[0].split('/');
  return rows.map(row => {
    const rank = [];
    for (const c of row) {
      if (isNaN(c)) rank.push(c);
      else for (let i = 0; i < +c; i++) rank.push(null);
    }
    return rank;
  });
}

// ── Rendu échiquier ───────────────────────────────────────────────
function renderBoard(fen, lastMove = null, classification = null, hideSq = null) {
  const wrap = document.getElementById('chess-board-wrap');
  const pos = parseFen(fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');

  const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = flipped ? [...FILES].reverse() : FILES;
  const rgb   = CLASSIF_RGBA[classification] || null;

  let html = '<div class="chess-board">';

  for (let ri = 0; ri < 8; ri++) {
    const rank = ranks[ri];
    for (let fi = 0; fi < 8; fi++) {
      const file = files[fi];
      const sq = file + rank;
      const isLight = (FILES.indexOf(file) + rank) % 2 === 0;
      const isDst  = lastMove && sq === lastMove[1];
      const isSrc  = lastMove && sq === lastMove[0];
      const isLast = isDst || isSrc;
      const rankIdx = 8 - rank;
      const fileIdx = FILES.indexOf(file);
      const piece = pos[rankIdx] ? pos[rankIdx][fileIdx] : null;
      const isWhitePiece = piece && piece === piece.toUpperCase();
      const isHidden = hideSq === sq;

      let bgStyle = '';
      if (isLast && rgb) {
        const alpha = isDst ? 0.82 : 0.50;
        bgStyle = ` style="background:rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})"`;
      }

      html += `<div class="sq ${isLight?'light':'dark'}${isLast&&!rgb?' last-move':''}" data-sq="${sq}"${bgStyle}>`;
      if (fi === 0) html += `<span class="coord-lbl coord-rank-lbl">${rank}</span>`;
      if (piece) html += `<span class="piece ${isWhitePiece?'w':'b'}"${isHidden?' style="opacity:0"':''}>${PIECE_UNICODE[piece]||''}</span>`;
      if (ri === 7) html += `<span class="coord-lbl coord-file-lbl">${file}</span>`;
      html += '</div>';
    }
  }

  html += '</div>';
  wrap.innerHTML = html;
}

// ── Flèche meilleur coup ──────────────────────────────────────────
function squareToCenter(sqName) {
  const fi   = sqName.charCodeAt(0) - 97; // 0–7 (a–h)
  const rank = parseInt(sqName[1]);        // 1–8
  const x = flipped ? (7 - fi) : fi;
  const y = flipped ? (rank - 1) : (8 - rank);
  return { x: x + 0.5, y: y + 0.5 };     // centre dans espace 8×8
}

function renderArrow(bestUci, playedUci) {
  const board = document.querySelector('.chess-board');
  if (!board) return;
  const old = board.querySelector('svg.best-arrow');
  if (old) old.remove();
  if (!bestUci || bestUci === playedUci) return;

  const from = squareToCenter(bestUci.slice(0, 2));
  const to   = squareToCenter(bestUci.slice(2, 4));
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  const headLen = 0.35;
  const ex = from.x + dx * (len - headLen) / len;
  const ey = from.y + dy * (len - headLen) / len;

  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 8 8');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('class', 'best-arrow');
  svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10';

  const defs   = document.createElementNS(ns, 'defs');
  const marker = document.createElementNS(ns, 'marker');
  marker.setAttribute('id', 'bm-head');
  marker.setAttribute('markerWidth', '3');
  marker.setAttribute('markerHeight', '3');
  marker.setAttribute('refX', '1.5');
  marker.setAttribute('refY', '1.5');
  marker.setAttribute('orient', 'auto');
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', '0,0 3,1.5 0,3');
  poly.setAttribute('fill', 'rgba(80,200,100,0.9)');
  marker.appendChild(poly);
  defs.appendChild(marker);
  svg.appendChild(defs);

  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
  line.setAttribute('x2', ex);     line.setAttribute('y2', ey);
  line.setAttribute('stroke', 'rgba(80,200,100,0.9)');
  line.setAttribute('stroke-width', '0.18');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('marker-end', 'url(#bm-head)');
  svg.appendChild(line);

  board.appendChild(svg);
}

// ── Animation pièces ──────────────────────────────────────────────
let activeAnim = null;

function getPieceAt(fen, sq) {
  const pos  = parseFen(fen);
  const fi   = sq.charCodeAt(0) - 97;
  const rank = parseInt(sq[1]);
  return (pos[8 - rank] || [])[fi] || null;
}

function revealPieceAt(sq) {
  const el = document.querySelector(`.sq[data-sq="${sq}"] .piece`);
  if (el) el.style.opacity = '';
}

function cancelAnim() {
  if (!activeAnim) return;
  clearTimeout(activeAnim.timeout);
  if (activeAnim.el.parentNode) activeAnim.el.remove();
  activeAnim = null;
}

function animatePiece(piece, fromSq, toSq, onDone) {
  const board = document.querySelector('.chess-board');
  if (!board || !piece) { onDone(); return; }

  const size = board.offsetWidth / 8;
  function sqPos(sq) {
    const fi   = sq.charCodeAt(0) - 97;
    const rank = parseInt(sq[1]);
    return {
      x: (flipped ? 7 - fi   : fi)       * size,
      y: (flipped ? rank - 1 : 8 - rank) * size,
    };
  }

  const from = sqPos(fromSq);
  const to   = sqPos(toSq);

  const el = document.createElement('span');
  el.className = `piece ${piece === piece.toUpperCase() ? 'w' : 'b'}`;
  el.textContent = PIECE_UNICODE[piece] || '';
  Object.assign(el.style, {
    position:       'absolute',
    left:           from.x + 'px',
    top:            from.y + 'px',
    width:          size + 'px',
    height:         size + 'px',
    display:        'flex',
    alignItems:     'center',
    justifyContent: 'center',
    zIndex:         '20',
    pointerEvents:  'none',
    transition:     'left 0.16s cubic-bezier(0.25,0.1,0.25,1), top 0.16s cubic-bezier(0.25,0.1,0.25,1)',
  });
  board.appendChild(el);

  el.getBoundingClientRect(); // force reflow
  el.style.left = to.x + 'px';
  el.style.top  = to.y + 'px';

  const done = () => { el.remove(); activeAnim = null; onDone(); };
  el.addEventListener('transitionend', done, { once: true });
  activeAnim = { el, timeout: setTimeout(done, 350) };
}

// ── Eval helpers ──────────────────────────────────────────────────
function cpToPercent(cp) {
  return 50 + (Math.max(-800, Math.min(800, cp || 0)) / 800) * 50;
}
function formatEval(cp) {
  if (cp === undefined || cp === null) return '0.0';
  if (Math.abs(cp) >= 9000) return cp > 0 ? 'M' : '-M';
  const v = (cp / 100).toFixed(1);
  return cp > 0 ? '+' + v : v;
}

// ── Navigation ────────────────────────────────────────────────────
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function goToMove(idx) {
  const prevHalfMove = currentHalfMove;
  const moves = gameData.moves;
  currentHalfMove = Math.max(0, Math.min(moves.length, idx));
  const step = currentHalfMove - prevHalfMove;

  const fen = currentHalfMove === 0
    ? START_FEN
    : (moves[currentHalfMove - 1].fen_after || null);

  let lastMove = null;
  if (currentHalfMove > 0) {
    const m = moves[currentHalfMove - 1];
    if (m.uci && m.uci.length >= 4) {
      lastMove = [m.uci.slice(0, 2), m.uci.slice(2, 4)];
    }
  }

  const classification = currentHalfMove > 0 ? moves[currentHalfMove - 1].classification : null;

  cancelAnim();

  // Calcul animation (seulement pour pas-à-pas)
  let animFrom = null, animTo = null, animPiece = null;
  if (Math.abs(step) === 1) {
    if (step === 1 && currentHalfMove > 0) {
      // Avance : pièce de src vers dst
      const m = moves[currentHalfMove - 1];
      animFrom = m.uci.slice(0, 2);
      animTo   = m.uci.slice(2, 4);
      const prevFen = currentHalfMove > 1 ? moves[currentHalfMove - 2].fen_after : START_FEN;
      animPiece = getPieceAt(prevFen, animFrom);
    } else if (step === -1 && prevHalfMove > 0) {
      // Recul : pièce de dst vers src
      const m = moves[prevHalfMove - 1];
      animFrom = m.uci.slice(2, 4);
      animTo   = m.uci.slice(0, 2);
      animPiece = getPieceAt(moves[prevHalfMove - 1].fen_after, animFrom);
    }
  }

  renderBoard(fen, lastMove, classification, animPiece ? animTo : null);
  if (animPiece) animatePiece(animPiece, animFrom, animTo, () => revealPieceAt(animTo));

  // Flèche meilleur coup
  if (currentHalfMove > 0) {
    const m = moves[currentHalfMove - 1];
    renderArrow(m.best_move_uci, m.uci);
  } else {
    renderArrow(null, null);
  }

  // Eval bar
  const cp = currentHalfMove === 0 ? 0 : (moves[currentHalfMove - 1].eval_after ?? 0);
  const pct = cpToPercent(cp);
  document.getElementById('eval-fill').style.height = pct + '%';
  document.getElementById('eval-label').textContent = formatEval(cp);

  // Highlight liste coups
  document.querySelectorAll('.move-cell').forEach(el => el.classList.remove('active'));
  if (currentHalfMove > 0) {
    const cell = document.getElementById(`mc-${currentHalfMove}`);
    if (cell) { cell.classList.add('active'); cell.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  }

  // Graphe
  if (evalChart) {
    evalChart.options.plugins.annotation.annotations.cursor.xMin = currentHalfMove - 1;
    evalChart.options.plugins.annotation.annotations.cursor.xMax = currentHalfMove - 1;
    evalChart.update('none');
  }
}

// ── Graphe eval ───────────────────────────────────────────────────
function initChart() {
  const moves = gameData.moves;
  const evals = moves.map(m => Math.max(-800, Math.min(800, m.eval_after ?? 0)));

  const ctx = document.getElementById('eval-chart').getContext('2d');
  evalChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: moves.map((_, i) => i),
      datasets: [{
        data: evals,
        borderColor: '#81b64c',
        borderWidth: 1.5,
        fill: true,
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 84);
          g.addColorStop(0, 'rgba(129,182,76,0.3)');
          g.addColorStop(1, 'rgba(129,182,76,0)');
          return g;
        },
        tension: 0.3, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBackgroundColor: '#fff',
      }]
    },
    options: {
      responsive: false, animation: false,
      scales: {
        x: { display: false },
        y: {
          min: -800, max: 800,
          grid: { color: '#3d3d3d' },
          ticks: {
            color: '#9e9e9e', font: { size: 9 },
            callback: v => v === 0 ? '0' : (v > 0 ? '+' + (v/100).toFixed(0) : (v/100).toFixed(0))
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => { const m = moves[ctx.dataIndex]; return ` ${m.san} — ${formatEval(m.eval_after)}`; } },
          backgroundColor: '#2c2c2c', borderColor: '#3d3d3d', borderWidth: 1,
          titleColor: '#9e9e9e', bodyColor: '#e0e0e0',
        },
        annotation: { annotations: { cursor: { type:'line', xMin:-1, xMax:-1, borderColor:'rgba(255,255,255,0.4)', borderWidth:1 } } }
      },
      onClick: (e, els) => { if (els.length) goToMove(els[0].index + 1); }
    }
  });
}

// ── Liste coups ───────────────────────────────────────────────────
function renderMoveList() {
  const moves = gameData.moves;
  let html = '';
  for (let i = 0; i < moves.length; i += 2) {
    const w = moves[i], b = moves[i+1];
    const wSym = SYMBOLS[w.classification] || '';
    const bSym = b ? (SYMBOLS[b.classification] || '') : '';
    const wCls = SYM_CLASS[w.classification] || '';
    const bCls = b ? (SYM_CLASS[b.classification] || '') : '';
    html += `<div class="move-row">
      <span class="move-num">${w.move_number}.</span>
      <span class="move-cell" id="mc-${i+1}" onclick="goToMove(${i+1})">
        ${w.san}${wSym ? `<span class="move-symbol ${wCls}">${wSym}</span>` : ''}
      </span>
      ${b ? `<span class="move-cell" id="mc-${i+2}" onclick="goToMove(${i+2})">
        ${b.san}${bSym ? `<span class="move-symbol ${bCls}">${bSym}</span>` : ''}
      </span>` : '<span></span>'}
    </div>`;
  }
  document.getElementById('move-list').innerHTML = html;
}

// ── Header partie ─────────────────────────────────────────────────
function renderGameHeader() {
  const meta = gameData.meta, s = gameData.summary;
  const isWhite = meta.player_color === 'white';
  const me = isWhite ? meta.white : meta.black;
  const opp = isWhite ? meta.black : meta.white;

  document.getElementById('header-title').textContent = `vs ${opp.username} · ${meta.time_class} · ${meta.date}`;
  document.getElementById('player-top-name').textContent = opp.username;
  document.getElementById('player-top-rating').textContent = `(${opp.rating})`;
  document.getElementById('player-top-dot').className = `player-color-dot ${isWhite ? 'black' : 'white'}`;
  document.getElementById('player-bot-name').textContent = me.username;
  document.getElementById('player-bot-rating').textContent = `(${me.rating})`;
  document.getElementById('player-bot-dot').className = `player-color-dot ${isWhite ? 'white' : 'black'}`;
  document.getElementById('opening-name').textContent = meta.opening || 'Ouverture inconnue';
  document.getElementById('accuracy-val').textContent = s.accuracy ? s.accuracy.toFixed(1) + '%' : '–';

  const chips = [];
  if (s.blunders > 0)     chips.push(`<span class="err-chip blunder">⬥ ${s.blunders} ??</span>`);
  if (s.mistakes > 0)     chips.push(`<span class="err-chip mistake">⬥ ${s.mistakes} ?</span>`);
  if (s.inaccuracies > 0) chips.push(`<span class="err-chip inaccuracy">⬥ ${s.inaccuracies} ?!</span>`);
  document.getElementById('error-chips').innerHTML = chips.join('') || '<span style="color:var(--good);font-size:12px">✓ Bonne partie !</span>';
  const coachEl = document.getElementById('coaching-text');
  coachEl.textContent = s.coaching || '';
  if (!s.coaching) refreshCoaching();
}

// ── Clavier ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!gameData) return;
  const map = { ArrowRight: 1, ArrowLeft: -1 };
  if (e.key in map) { e.preventDefault(); goToMove(currentHalfMove + map[e.key]); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); goToMove(0); }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToMove(gameData.moves.length); }
  if (e.key === 'f')         toggleFlip();
});

function toggleFlip() {
  flipped = !flipped;
  goToMove(currentHalfMove);
}

// ── Coaching ─────────────────────────────────────────────────────
async function refreshCoaching() {
  const btn = document.getElementById('coaching-refresh');
  const txt = document.getElementById('coaching-text');
  if (btn) btn.style.opacity = '0.4';
  txt.textContent = 'Génération en cours…';
  try {
    const r = await fetch(`/api/coaching/${uuid}`, { method: 'POST' });
    const d = await r.json();
    txt.textContent = d.coaching || 'Coaching indisponible.';
    if (gameData) gameData.summary.coaching = d.coaching || '';
  } catch(e) {
    txt.textContent = 'Erreur lors de la génération.';
  }
  if (btn) btn.style.opacity = '';
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const app = document.getElementById('app');

  if (!uuid) {
    app.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h2>ID de partie manquant</h2><p><a href="index.html">Retour</a></p></div>`;
    return;
  }

  let data;
  try {
    data = await loadGame();
  } catch(e) {
    app.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h2>Partie introuvable</h2><p>${e.message}</p><p><a href="games.html">Retour aux parties</a></p></div>`;
    return;
  }

  gameData = data;

  // Construire le layout
  app.id = '';
  app.removeAttribute('style');
  app.className = 'game-layout';
  app.innerHTML = `
    <div class="eval-bar-container">
      <div class="eval-bar">
        <div class="eval-bar-fill" id="eval-fill" style="height:50%"></div>
      </div>
      <div class="eval-label" id="eval-label">0.0</div>
    </div>

    <div class="board-area">
      <div class="player-info">
        <div class="player-avatar">♟</div>
        <span class="player-name" id="player-top-name"></span>
        <span class="player-rating" id="player-top-rating"></span>
        <div class="player-color-dot" id="player-top-dot"></div>
      </div>
      <div id="chess-board-wrap"></div>
      <div class="player-info">
        <div class="player-avatar">♙</div>
        <span class="player-name" id="player-bot-name"></span>
        <span class="player-rating" id="player-bot-rating"></span>
        <div class="player-color-dot" id="player-bot-dot"></div>
      </div>
      <div class="board-controls">
        <button class="ctrl-btn" onclick="goToMove(0)" title="Début ↑">⏮</button>
        <button class="ctrl-btn" onclick="goToMove(currentHalfMove-1)" title="← Précédent">◀</button>
        <button class="ctrl-btn" onclick="goToMove(currentHalfMove+1)" title="Suivant →">▶</button>
        <button class="ctrl-btn" onclick="goToMove(gameData.moves.length)" title="Fin ↓">⏭</button>
        <button class="ctrl-btn flip-btn" onclick="toggleFlip()" title="Retourner (F)">⇅</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="game-meta-header">
        <div class="opening-name" id="opening-name"></div>
        <div class="accuracy-row">
          <div class="acc-block"><div class="acc-pct" id="accuracy-val">–</div><div class="acc-side">précision</div></div>
        </div>
        <div class="error-summary" id="error-chips"></div>
      </div>
      <div class="moves-container"><div id="move-list"></div></div>
      <div class="coaching-section">
        <div class="coach-title" style="justify-content:space-between">
          <span>🤖 Coaching IA</span>
          <button id="coaching-refresh" onclick="refreshCoaching()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0" title="Régénérer">↺</button>
        </div>
        <p id="coaching-text"></p>
      </div>
    </div>

    <div class="chart-section">
      <canvas id="eval-chart" height="84"></canvas>
    </div>
  `;

  flipped = gameData.meta.player_color === 'black';

  renderGameHeader();
  renderMoveList();
  goToMove(0);
  initChart();
}

init();
</script>
</body>
</html>
