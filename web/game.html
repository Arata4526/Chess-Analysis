<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse partie – Chess</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.5/assets/chessground.base.css">
  <style>
    /* ── Wrapper Chessground ── */
    #chess-board-wrap {
      width: min(calc(100vh - 52px - 220px), 520px);
      height: min(calc(100vh - 52px - 220px), 520px);
      flex-shrink: 0;
      position: relative;
    }

    /* Damier vert chess.com via pattern SVG */
    cg-board {
      background-color: #eeeed2;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2'><rect width='1' height='1' fill='%23769656' x='1' y='0'/><rect width='1' height='1' fill='%23769656' x='0' y='1'/></svg>");
      background-size: 25% 25%;
    }
    cg-board square.last-move { background-color: rgba(155,199,0,0.41); }

    /* Pièces cburnett (override des background-image par défaut de chessground) */
    cg-board piece.pawn.white   { background-image: url('pieces/cburnett/wP.svg'); }
    cg-board piece.knight.white { background-image: url('pieces/cburnett/wN.svg'); }
    cg-board piece.bishop.white { background-image: url('pieces/cburnett/wB.svg'); }
    cg-board piece.rook.white   { background-image: url('pieces/cburnett/wR.svg'); }
    cg-board piece.queen.white  { background-image: url('pieces/cburnett/wQ.svg'); }
    cg-board piece.king.white   { background-image: url('pieces/cburnett/wK.svg'); }
    cg-board piece.pawn.black   { background-image: url('pieces/cburnett/bP.svg'); }
    cg-board piece.knight.black { background-image: url('pieces/cburnett/bN.svg'); }
    cg-board piece.bishop.black { background-image: url('pieces/cburnett/bB.svg'); }
    cg-board piece.rook.black   { background-image: url('pieces/cburnett/bR.svg'); }
    cg-board piece.queen.black  { background-image: url('pieces/cburnett/bQ.svg'); }
    cg-board piece.king.black   { background-image: url('pieces/cburnett/bK.svg'); }

    /* Coordonnées : à l'intérieur du board, comme avant */
    .cg-wrap coords {
      position: absolute;
      pointer-events: none;
      font-weight: 700;
      font-size: 10px;
      display: flex;
    }
    .cg-wrap coords.ranks {
      left: 2px; top: 0; bottom: 0;
      flex-direction: column-reverse;
      width: auto;
    }
    .cg-wrap coords.ranks.black { flex-direction: column; }
    .cg-wrap coords.files {
      left: 0; right: 0; bottom: 0;
      flex-direction: row;
      text-align: right;
      padding-right: 4px;
      height: auto;
      text-transform: lowercase;
    }
    .cg-wrap coords.files.black { flex-direction: row-reverse; }
    .cg-wrap coords coord { flex: 1 1 auto; line-height: 1; }
    /* Couleur des coords alternée (light = vert, dark = beige) */
    .cg-wrap coords.ranks coord:nth-child(odd)  { color: #eeeed2; }
    .cg-wrap coords.ranks coord:nth-child(even) { color: #769656; }
    .cg-wrap coords.files coord:nth-child(odd)  { color: #769656; }
    .cg-wrap coords.files coord:nth-child(even) { color: #eeeed2; }
  </style>
</head>
<body>

<header class="site-header">
  <button class="back-btn" onclick="history.length>1 ? history.back() : location.href='index.html'">‹</button>
  <div class="logo">♟ <span>Chess</span>Analysis</div>
  <span id="header-title" style="color:var(--text-muted);font-size:13px;margin-left:4px"></span>
</header>

<div id="app" style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 52px)">
  <div class="loading"><div class="spinner"></div> Chargement…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

<script type="module">
import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.1.5/+esm';

// ── Constantes ────────────────────────────────────────────────────
const SYMBOLS = {
  blunder:'??', mistake:'?', inaccuracy:'?!',
  good:'!', excellent:'!!', best:'', 'n/a':''
};
const SYM_CLASS = {
  blunder:'sym-blunder', mistake:'sym-mistake', inaccuracy:'sym-inaccuracy',
  good:'sym-good', excellent:'sym-excellent', best:'sym-best'
};
// Couleurs CSS pour les surbrillances de cases par classification
const CLASSIF_HEX = {
  blunder:    '#fa412d',
  mistake:    '#ffa459',
  inaccuracy: '#f7c245',
  good:       '#95bb4a',
  excellent:  '#76a3d6',
  best:       '#1cada6',
};

// ── État ──────────────────────────────────────────────────────────
const uuid = new URLSearchParams(location.search).get('id');
let gameData = null;
let evalChart = null;
let currentHalfMove = 0;
let flipped = false;
let cg = null;  // instance Chessground

// ── Fetch JSON ────────────────────────────────────────────────────
async function loadGame() {
  const res = await fetch(`data/${uuid}.json?t=${Date.now()}`);
  if (!res.ok) throw new Error('Partie introuvable');
  return res.json();
}

// ── Init Chessground ─────────────────────────────────────────────
function initBoard() {
  const wrap = document.getElementById('chess-board-wrap');
  wrap.innerHTML = '';
  // Construire les brushes pour highlights de cases + flèche best move
  const brushes = {
    bestmove: { key: 'bestmove', color: '#1cada6', opacity: 0.85, lineWidth: 12 },
  };
  for (const [k, color] of Object.entries(CLASSIF_HEX)) {
    brushes['cls-' + k] = { key: 'cls-' + k, color, opacity: 0.55, lineWidth: 10 };
  }
  cg = Chessground(wrap, {
    fen: START_FEN,
    orientation: flipped ? 'black' : 'white',
    viewOnly: true,
    coordinates: true,
    highlight: { lastMove: false, check: true },  // on gère le last-move via shapes colorées
    animation: { enabled: true, duration: 200 },
    drawable: {
      enabled: false,
      visible: true,
      autoShapes: [],
      brushes,
    },
  });
}

// ── Eval helpers ──────────────────────────────────────────────────
function cpToPercent(cp) {
  return 50 + (Math.max(-800, Math.min(800, cp || 0)) / 800) * 50;
}
function formatEval(cp) {
  if (cp === undefined || cp === null) return '0.0';
  if (Math.abs(cp) >= 9000) return cp > 0 ? 'M' : '-M';
  const v = (cp / 100).toFixed(1);
  return cp > 0 ? '+' + v : v;
}

// ── Navigation ────────────────────────────────────────────────────
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function goToMove(idx) {
  const moves = gameData.moves;
  currentHalfMove = Math.max(0, Math.min(moves.length, idx));

  const fen = currentHalfMove === 0
    ? START_FEN
    : (moves[currentHalfMove - 1].fen_after || START_FEN);

  let lastMove = null;
  let classification = null;
  let bestUci = null;
  let playedUci = null;
  if (currentHalfMove > 0) {
    const m = moves[currentHalfMove - 1];
    if (m.uci && m.uci.length >= 4) {
      lastMove = [m.uci.slice(0, 2), m.uci.slice(2, 4)];
    }
    classification = m.classification;
    bestUci  = m.best_move_uci;
    playedUci = m.uci;
  }

  // Shapes : cases src/dst colorées par classification + flèche best move
  const shapes = [];
  if (lastMove && classification && classification !== 'n/a' && CLASSIF_HEX[classification]) {
    shapes.push({ orig: lastMove[0], brush: 'cls-' + classification });
    shapes.push({ orig: lastMove[1], brush: 'cls-' + classification });
  }
  if (bestUci && bestUci !== playedUci && bestUci.length >= 4) {
    shapes.push({
      orig: bestUci.slice(0, 2),
      dest: bestUci.slice(2, 4),
      brush: 'bestmove',
    });
  }

  cg.set({
    fen,
    lastMove,
    orientation: flipped ? 'black' : 'white',
    drawable: { autoShapes: shapes },
  });

  // Eval bar
  const cp = currentHalfMove === 0 ? 0 : (moves[currentHalfMove - 1].eval_after ?? 0);
  const pct = cpToPercent(cp);
  document.getElementById('eval-fill').style.height = pct + '%';
  document.getElementById('eval-label').textContent = formatEval(cp);

  // Highlight liste coups
  document.querySelectorAll('.move-cell').forEach(el => el.classList.remove('active'));
  if (currentHalfMove > 0) {
    const cell = document.getElementById(`mc-${currentHalfMove}`);
    if (cell) { cell.classList.add('active'); cell.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  }

  // Graphe
  if (evalChart) {
    evalChart.options.plugins.annotation.annotations.cursor.xMin = currentHalfMove - 1;
    evalChart.options.plugins.annotation.annotations.cursor.xMax = currentHalfMove - 1;
    evalChart.update('none');
  }
}

// ── Graphe eval ───────────────────────────────────────────────────
function initChart() {
  const moves = gameData.moves;
  const evals = moves.map(m => Math.max(-800, Math.min(800, m.eval_after ?? 0)));

  const ctx = document.getElementById('eval-chart').getContext('2d');
  evalChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: moves.map((_, i) => i),
      datasets: [{
        data: evals,
        borderColor: '#81b64c',
        borderWidth: 1.5,
        fill: true,
        backgroundColor: (ctx) => {
          const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 84);
          g.addColorStop(0, 'rgba(129,182,76,0.3)');
          g.addColorStop(1, 'rgba(129,182,76,0)');
          return g;
        },
        tension: 0.3, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBackgroundColor: '#fff',
      }]
    },
    options: {
      responsive: false, animation: false,
      scales: {
        x: { display: false },
        y: {
          min: -800, max: 800,
          grid: { color: '#3d3d3d' },
          ticks: {
            color: '#9e9e9e', font: { size: 9 },
            callback: v => v === 0 ? '0' : (v > 0 ? '+' + (v/100).toFixed(0) : (v/100).toFixed(0))
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => { const m = moves[ctx.dataIndex]; return ` ${m.san} — ${formatEval(m.eval_after)}`; } },
          backgroundColor: '#2c2c2c', borderColor: '#3d3d3d', borderWidth: 1,
          titleColor: '#9e9e9e', bodyColor: '#e0e0e0',
        },
        annotation: { annotations: { cursor: { type:'line', xMin:-1, xMax:-1, borderColor:'rgba(255,255,255,0.4)', borderWidth:1 } } }
      },
      onClick: (e, els) => { if (els.length) goToMove(els[0].index + 1); }
    }
  });
}

// ── Liste coups ───────────────────────────────────────────────────
function renderMoveList() {
  const moves = gameData.moves;
  let html = '';
  for (let i = 0; i < moves.length; i += 2) {
    const w = moves[i], b = moves[i+1];
    const wSym = SYMBOLS[w.classification] || '';
    const bSym = b ? (SYMBOLS[b.classification] || '') : '';
    const wCls = SYM_CLASS[w.classification] || '';
    const bCls = b ? (SYM_CLASS[b.classification] || '') : '';
    html += `<div class="move-row">
      <span class="move-num">${w.move_number}.</span>
      <span class="move-cell" id="mc-${i+1}" onclick="goToMove(${i+1})">
        ${w.san}${wSym ? `<span class="move-symbol ${wCls}">${wSym}</span>` : ''}
      </span>
      ${b ? `<span class="move-cell" id="mc-${i+2}" onclick="goToMove(${i+2})">
        ${b.san}${bSym ? `<span class="move-symbol ${bCls}">${bSym}</span>` : ''}
      </span>` : '<span></span>'}
    </div>`;
  }
  document.getElementById('move-list').innerHTML = html;
}

// ── Header partie ─────────────────────────────────────────────────
function renderGameHeader() {
  const meta = gameData.meta, s = gameData.summary;
  const isWhite = meta.player_color === 'white';
  const me = isWhite ? meta.white : meta.black;
  const opp = isWhite ? meta.black : meta.white;

  document.getElementById('header-title').textContent = `vs ${opp.username} · ${meta.time_class} · ${meta.date}`;
  document.getElementById('player-top-name').textContent = opp.username;
  document.getElementById('player-top-rating').textContent = `(${opp.rating})`;
  document.getElementById('player-top-dot').className = `player-color-dot ${isWhite ? 'black' : 'white'}`;
  document.getElementById('player-bot-name').textContent = me.username;
  document.getElementById('player-bot-rating').textContent = `(${me.rating})`;
  document.getElementById('player-bot-dot').className = `player-color-dot ${isWhite ? 'white' : 'black'}`;
  document.getElementById('opening-name').textContent = meta.opening || 'Ouverture inconnue';
  document.getElementById('accuracy-val').textContent = s.accuracy ? s.accuracy.toFixed(1) + '%' : '–';

  const chips = [];
  if (s.blunders > 0)     chips.push(`<span class="err-chip blunder">⬥ ${s.blunders} ??</span>`);
  if (s.mistakes > 0)     chips.push(`<span class="err-chip mistake">⬥ ${s.mistakes} ?</span>`);
  if (s.inaccuracies > 0) chips.push(`<span class="err-chip inaccuracy">⬥ ${s.inaccuracies} ?!</span>`);
  document.getElementById('error-chips').innerHTML = chips.join('') || '<span style="color:var(--good);font-size:12px">✓ Bonne partie !</span>';
  const coachEl = document.getElementById('coaching-text');
  coachEl.textContent = s.coaching || '';
  if (!s.coaching) refreshCoaching();
}

// ── Clavier ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!gameData) return;
  const map = { ArrowRight: 1, ArrowLeft: -1 };
  if (e.key in map) { e.preventDefault(); goToMove(currentHalfMove + map[e.key]); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); goToMove(0); }
  if (e.key === 'ArrowDown') { e.preventDefault(); goToMove(gameData.moves.length); }
  if (e.key === 'f')         toggleFlip();
});

function toggleFlip() {
  flipped = !flipped;
  goToMove(currentHalfMove);
}

// ── Coaching ─────────────────────────────────────────────────────
async function refreshCoaching() {
  const btn = document.getElementById('coaching-refresh');
  const txt = document.getElementById('coaching-text');
  if (btn) btn.style.opacity = '0.4';
  txt.textContent = 'Génération en cours…';
  try {
    const r = await fetch(`/api/coaching/${uuid}`, { method: 'POST' });
    const d = await r.json();
    txt.textContent = d.coaching || 'Coaching indisponible.';
    if (gameData) gameData.summary.coaching = d.coaching || '';
  } catch(e) {
    txt.textContent = 'Erreur lors de la génération.';
  }
  if (btn) btn.style.opacity = '';
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const app = document.getElementById('app');

  if (!uuid) {
    app.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h2>ID de partie manquant</h2><p><a href="index.html">Retour</a></p></div>`;
    return;
  }

  let data;
  try {
    data = await loadGame();
  } catch(e) {
    app.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h2>Partie introuvable</h2><p>${e.message}</p><p><a href="games.html">Retour aux parties</a></p></div>`;
    return;
  }

  gameData = data;

  // Construire le layout
  app.id = '';
  app.removeAttribute('style');
  app.className = 'game-layout';
  app.innerHTML = `
    <div class="eval-bar-container">
      <div class="eval-bar">
        <div class="eval-bar-fill" id="eval-fill" style="height:50%"></div>
      </div>
      <div class="eval-label" id="eval-label">0.0</div>
    </div>

    <div class="board-area">
      <div class="player-info">
        <div class="player-avatar">♟</div>
        <span class="player-name" id="player-top-name"></span>
        <span class="player-rating" id="player-top-rating"></span>
        <div class="player-color-dot" id="player-top-dot"></div>
      </div>
      <div id="chess-board-wrap"></div>
      <div class="player-info">
        <div class="player-avatar">♙</div>
        <span class="player-name" id="player-bot-name"></span>
        <span class="player-rating" id="player-bot-rating"></span>
        <div class="player-color-dot" id="player-bot-dot"></div>
      </div>
      <div class="board-controls">
        <button class="ctrl-btn" onclick="goStart()" title="Début ↑">⏮</button>
        <button class="ctrl-btn" onclick="goPrev()" title="← Précédent">◀</button>
        <button class="ctrl-btn" onclick="goNext()" title="Suivant →">▶</button>
        <button class="ctrl-btn" onclick="goEnd()" title="Fin ↓">⏭</button>
        <button class="ctrl-btn flip-btn" onclick="toggleFlip()" title="Retourner (F)">⇅</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="game-meta-header">
        <div class="opening-name" id="opening-name"></div>
        <div class="accuracy-row">
          <div class="acc-block"><div class="acc-pct" id="accuracy-val">–</div><div class="acc-side">précision</div></div>
        </div>
        <div class="error-summary" id="error-chips"></div>
      </div>
      <div class="moves-container"><div id="move-list"></div></div>
      <div class="coaching-section">
        <div class="coach-title" style="justify-content:space-between">
          <span>🤖 Coaching IA</span>
          <button id="coaching-refresh" onclick="refreshCoaching()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0" title="Régénérer">↺</button>
        </div>
        <p id="coaching-text"></p>
      </div>
    </div>

    <div class="chart-section">
      <canvas id="eval-chart" height="84"></canvas>
    </div>
  `;

  flipped = gameData.meta.player_color === 'black';

  initBoard();
  renderGameHeader();
  renderMoveList();
  goToMove(0);
  initChart();
}

// Expose pour les onclick inline (le script est un module → scope isolé)
window.goToMove       = goToMove;
window.toggleFlip     = toggleFlip;
window.refreshCoaching = refreshCoaching;
window.goStart = () => goToMove(0);
window.goPrev  = () => goToMove(currentHalfMove - 1);
window.goNext  = () => goToMove(currentHalfMove + 1);
window.goEnd   = () => goToMove(gameData ? gameData.moves.length : 0);

init();
</script>
</body>
</html>
