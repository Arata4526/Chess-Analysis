services:
  chess-web:
    image: nginx:1.27-alpine
    container_name: chess_web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./data:/data
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chess-api
    networks:
      - docker_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  chess-api:
    build: ./api
    container_name: chess_api
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./analysis/.env:/data/.env:ro
    networks:
      - docker_default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  docker_default:
    external: true
