services:
  chess-web:
    image: nginx:alpine
    container_name: chess_web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./data:/data
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docker_default

networks:
  docker_default:
    external: true
