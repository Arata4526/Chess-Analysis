services:
  chess-web:
    image: nginx:alpine
    container_name: chess_web
    restart: unless-stopped
    env_file: ./analysis/.env
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./data:/data
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - chess-api
    networks:
      - docker_default

  chess-api:
    build: ./api
    container_name: chess_api
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./analysis/.env:/data/.env:ro
    networks:
      - docker_default

networks:
  docker_default:
    external: true
